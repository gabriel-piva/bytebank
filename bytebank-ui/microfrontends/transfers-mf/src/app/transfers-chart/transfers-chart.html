<div class="transfers-chart-container">
  <div class="chart-header">
    <h2>Dashboard de Transferências</h2>
    <p>Acompanhe o histórico das suas transferências bancárias</p>
  </div>

  <div class="chart-wrapper">
    <canvas #chartCanvas width="400" height="200"></canvas>
  </div>

  <div class="chart-footer">
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">Total Enviado</span>
        <span class="stat-value sent">R$ 14.600,00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Total Recebido</span>
        <span class="stat-value received">R$ 14.500,00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Saldo Líquido</span>
        <span class="stat-value balance">- R$ 100,00</span>
      </div>
    </div>
  </div>
</div>
